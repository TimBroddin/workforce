<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: 'BundledNerdFont';
    src: url('agenthub://JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'BundledNerdFont';
    src: url('agenthub://JetBrainsMonoNerdFontMono-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
  #terminal { width: 100%; height: 100%; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.min.js"></script>
</head>
<body>
<div id="terminal"></div>
<script>
(async function() {
  var FONT_FAMILY = 'BundledNerdFont';

  try {
    await document.fonts.load('400 13px BundledNerdFont');
    await document.fonts.load('700 13px BundledNerdFont');
    await document.fonts.ready;
  } catch (e) {}

  var fitAddon = new FitAddon.FitAddon();

  var term = new Terminal({
    cursorBlink: true,
    scrollback: 10000,
    fontSize: 13,
    fontFamily: FONT_FAMILY,
    allowProposedApi: true,
    theme: {
      background: '#1e1e1e',
      foreground: '#d4d4d4',
      cursor: '#d4d4d4',
      selectionBackground: '#264f78',
      black: '#000000',
      red: '#cd3131',
      green: '#0dbc79',
      yellow: '#e5e510',
      blue: '#2472c8',
      magenta: '#bc3fbc',
      cyan: '#11a8cd',
      white: '#e5e5e5',
      brightBlack: '#666666',
      brightRed: '#f14c4c',
      brightGreen: '#23d18b',
      brightYellow: '#f5f543',
      brightBlue: '#3b8eea',
      brightMagenta: '#d670d6',
      brightCyan: '#29b8db',
      brightWhite: '#e5e5e5'
    }
  });

  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));

  // Try WebGL for better performance, fall back to canvas
  try {
    var webglAddon = new WebglAddon.WebglAddon();
    term.loadAddon(webglAddon);
  } catch (e) {}

  fitAddon.fit();

  term.onData(function(data) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalInput) {
      window.webkit.messageHandlers.terminalInput.postMessage(data);
    }
  });

  term.onResize(function(size) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalResize) {
      window.webkit.messageHandlers.terminalResize.postMessage({ cols: size.cols, rows: size.rows });
    }
  });

  var resizeObserver = new ResizeObserver(function() { fitAddon.fit(); });
  resizeObserver.observe(document.getElementById('terminal'));

  window.terminalAPI = {
    write: function(data) { term.write(data); },
    writeBinary: function(base64) {
      var bytes = atob(base64);
      var arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) { arr[i] = bytes.charCodeAt(i); }
      term.write(arr);
    },
    clear: function() { term.clear(); },
    focus: function() { term.focus(); },
    resize: function() { fitAddon.fit(); },
    getSize: function() { return { cols: term.cols, rows: term.rows }; }
  };

  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalReady) {
    window.webkit.messageHandlers.terminalReady.postMessage({ cols: term.cols, rows: term.rows });
  }
})();
</script>
</body>
</html>
